services:
  mysql:
    image: mysql:8.4
    container_name: gastra-mysql
    restart: unless-stopped
    # Permite que o usuário da aplicação crie os triggers das migrations. Sem isso, com o log
    # binário ligado (padrão do 8.4), o MySQL exige privilégio SUPER. Os triggers do GASTRA são
    # determinísticos (só bloqueiam a operação), então não há risco para a replicação.
    command: --log-bin-trust-function-creators=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - gastra_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gastra_mysql_data: