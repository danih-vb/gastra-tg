# Serve a SPA e repassa /api para a API (decisão D12). Como tudo sai da mesma origem, não há CORS —
# e o celular na rede local funciona pelo IP da máquina sem nada recompilado.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão do que vale a pena; imagem e fonte já vêm comprimidas.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A versão do nginx não interessa a ninguém de fora.
    server_tokens off;

    # A SPA cuida do roteamento: qualquer caminho cai no index.html, senão recarregar
    # /cliente/conta/<codigo> daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os arquivos com hash no nome podem ficar em cache para sempre; o index.html, nunca,
    # senão o navegador continua servindo a versão velha depois de um deploy.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O Swagger só existe quando a API sobe em Development, e é útil na demonstração.
    location /swagger/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Saúde do próprio contêiner web: responde sem depender da API.
    location = /saude {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
